spring.application.name=epcore

# Carga opcional de un archivo .env local (NO se versiona).
spring.config.import=optional:file:.env[.properties]

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epcore_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:epcore_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# JWT
# ===============================
# Para producción, definir JWT_SECRET en .env con un valor propio de al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
