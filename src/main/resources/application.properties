spring.application.name=epcore

# ===============================
# MYSQL DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epcore_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:epcore_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

# El esquema lo crean y cambian las migraciones de Flyway (db/migration); JPA solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# MIGRACIONES (FLYWAY)
# ===============================

# Las bases creadas antes de Flyway se ponen al día y se marcan como versión 1 (MigracionesBaseDatos).
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema existente antes de Flyway

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.cache=false

# ===============================
# SERVER
# ===============================

server.port=${SERVER_PORT:8080}

# En producción EpCore va detrás de Apache/Nginx con HTTPS (ver docs/07-https-y-respaldos.md):
# confía en las cabeceras X-Forwarded-* solo cuando vienen de la red interna del proxy.
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true en producción (HTTPS): la cookie de sesión nunca viaja por HTTP.
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}

# ===============================
# ARCHIVOS DE PROVEEDORES
# ===============================

# Directorio base donde se guardan los documentos
epcore.archivos.directorio=uploads

# Tamaño máximo permitido por archivo
spring.servlet.multipart.max-file-size=10MB

# Tamaño máximo permitido por solicitud
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JWT
# ===============================

# Para producción, definir JWT_SECRET en .env con un valor propio de al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ===============================
# CLIENTES (una base de datos por cliente)
# ===============================

# Archivo local creado por scripts/alta-cliente.ps1 (o .sh). No está en Git porque tiene claves.
spring.config.import=optional:file:./config/clientes.properties
